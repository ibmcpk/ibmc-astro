<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051937" />
      <stop offset="50%" stop-color="#0A2540" />
      <stop offset="100%" stop-color="#001021" />
    </linearGradient>

    <!-- Circuit Board / Tech Lines Pattern -->
    <pattern id="circuit" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 20 40 L 60 40 L 60 80" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1.5" />
      <path d="M 0 60 L 40 60 L 40 20 L 80 20" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1.5" />
      <circle cx="20" cy="40" r="2" fill="#FFFFFF" fill-opacity="0.08" />
      <circle cx="60" cy="40" r="2" fill="#FFFFFF" fill-opacity="0.08" />
    </pattern>

    <!-- Soft Glow Filter for Badge -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />
  <rect width="1200" height="630" fill="url(#circuit)" />

  <!-- LEFT COLUMN: Brand Iconography (from previous design) -->
  <g transform="translate(140, 115)">
    <!-- Outer Glow Circle -->
    <circle cx="200" cy="200" r="190" fill="#0056B3" filter="url(#glow)" />
    
    <!-- Circular Brand Badge -->
    <circle cx="200" cy="200" r="185" fill="#0056B3" />

    <!-- IBMC Integrated Lettering & Pen Nib Icon -->
    <g transform="translate(45, 90)">
      <!-- Pen Nib / Integrated 'I' -->
      <path d="M 12,120 L 12,30 L 22,10 L 32,30 L 32,120 Z" fill="#FFFFFF" />
      <line x1="22" y1="10" x2="22" y2="70" stroke="#0056B3" stroke-width="3" />
      <circle cx="22" cy="70" r="4" fill="#0056B3" />

      <!-- Letter 'B' -->
      <path d="M 65,10 H 125 C 150,10 165,22 165,42 C 165,56 155,66 140,71 C 160,76 172,88 172,106 C 172,128 152,140 125,140 H 65 Z 
               M 98,34 V 58 H 120 C 128,58 134,53 134,46 C 134,39 128,34 120,34 Z 
               M 98,82 V 116 H 124 C 133,116 140,110 140,99 C 140,88 133,82 124,82 Z" fill="#FFFFFF" />
    </g>

    <g transform="translate(45, 210)">
      <!-- Letter 'M' -->
      <path d="M 5,170 V 10 H 40 L 82,105 L 124,10 H 159 V 170 H 126 V 65 L 89,150 H 75 L 38,65 V 170 Z" fill="#FFFFFF" />

      <!-- Letter 'C' -->
      <path d="M 320,55 C 305,25 272,5 230,5 C 175,5 140,48 140,105 C 140,162 175,205 230,205 C 275,205 308,182 323,150 L 290,132 C 280,152 258,168 230,168 C 196,168 174,140 174,105 C 174,70 196,42 230,42 C 258,42 278,57 288,76 Z" fill="#FFFFFF" />
    </g>
  </g>

  <!-- RIGHT COLUMN: New Text & Details from ibmc.pk -->
  <g transform="translate(580, 205)">
    <!-- Primary Title -->
    <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
      IB Math Center
    </text>

    <!-- Subtitle / Key Offerings -->
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#A0AEC0">
      IB DP & MYP  •  Digital SAT  •  A-Level Sciences
    </text>

    <!-- Minimal Pill Badges -->
    <g transform="translate(0, 160)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="165" height="38" rx="8" fill="#1A365D" stroke="#0056B3" stroke-width="1.5" />
      <text x="82.5" y="24" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="16" font-weight="600" fill="#63B3ED" text-anchor="middle">Subject Resources</text>

      <!-- Badge 2 -->
      <rect x="180" y="0" width="135" height="38" rx="8" fill="#1A365D" stroke="#0056B3" stroke-width="1.5" />
      <text x="247.5" y="24" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="16" font-weight="600" fill="#63B3ED" text-anchor="middle">Lahore, PK</text>
    </g>

    <!-- Clean Website URL Footer -->
    <text x="0" y="255" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, monospace" font-size="24" font-weight="600" fill="#3182CE">
      ibmc.pk
    </text>
  </g>
</svg>